name: Deploy to GitHub Pages

# Publishes the app after every push, so the phone always has the latest phase.
# The tests and the production build both have to pass first — a red build
# never reaches the phone.
#
# Deployment works by force-pushing the built site to the gh-pages branch.
# This route was chosen deliberately: GitHub enables the Pages site
# automatically when a gh-pages branch exists, whereas the Actions-native
# deployment (configure-pages/deploy-pages) requires the site to be switched
# on by hand in repository settings first — creating it needs admin rights
# that GITHUB_TOKEN is refused even with pages:write ("Resource not
# accessible by integration"). The branch route has no manual step at all.

on:
  push:
    branches: [claude/workout-logger-plan-bwvwms]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # @playwright/test is only used by the screenshot script, which does not
      # run here. Skip the browser download to keep the job fast.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Must match the repository name — GitHub Pages serves from /<repo>/.
          VITE_BASE_PATH: /project/

      - name: Push to gh-pages
        run: |
          cd dist
          # Stops GitHub running the site through Jekyll, which would drop
          # files and slow the publish down.
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
