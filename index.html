<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values on an iPhone, per the Part 7 quality floor. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Value is set from src/styles/tokens.ts at startup so it cannot drift
         from the background colour. The literal here is only what shows before
         the bundle runs. -->
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="color-scheme" content="dark" />
    <!-- Full-screen when launched from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Relative hrefs, so the same file works at / locally and at /project/
         on GitHub Pages. Both files are generated by make-pwa-assets from
         tokens.ts, so their colours cannot drift from the app's. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Workout</title>
    <script type="module" crossorigin src="/project/assets/index-CmTfej9W.js"></script>
    <link rel="stylesheet" crossorigin href="/project/assets/index-CTCSZmvt.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
